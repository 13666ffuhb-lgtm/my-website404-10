<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Error Page</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-paper: #ffffff;
      --ink-main: #0f1115;
      --ink-soft: #22262e;
      --burn-heat: 0;
      --scorch-alpha: 0;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-paper);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--ink-main);
    }

    /* Screen shake animation during short-circuit and burning */
    @keyframes shortCircuitShake {
      0% { transform: translate(0, 0) rotate(0deg); }
      15% { transform: translate(-8px, 6px) rotate(-0.8deg); }
      30% { transform: translate(9px, -7px) rotate(0.9deg); }
      45% { transform: translate(-7px, -5px) rotate(-0.6deg); }
      60% { transform: translate(7px, 6px) rotate(0.7deg); }
      75% { transform: translate(-4px, 3px) rotate(-0.3deg); }
      90% { transform: translate(4px, -3px) rotate(0.3deg); }
      100% { transform: translate(0, 0) rotate(0deg); }
    }

    @keyframes emberPulse {
      0%, 100% {
        filter: drop-shadow(0 0 8px rgba(255, 85, 0, 0.85)) drop-shadow(0 0 22px rgba(255, 30, 0, 0.55));
      }
      50% {
        filter: drop-shadow(0 0 16px rgba(255, 160, 20, 1)) drop-shadow(0 0 34px rgba(255, 60, 0, 0.8));
      }
    }

    .shaking {
      animation: shortCircuitShake 0.16s infinite;
    }

    .ember-glow {
      animation: emberPulse 0.9s ease-in-out infinite;
    }

    /* Fullscreen canvas for sparks, lightning arcs, smoke, and embers */
    #fx-canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 30;
    }

    /* Scorch and burn vignette overlay on the page */
    #burn-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 20;
      opacity: 0;
      transition: opacity 0.45s ease;
      background:
        radial-gradient(circle at 50% 50%, rgba(255, 90, 10, 0.22) 0%, rgba(35, 14, 8, 0.55) 48%, rgba(10, 8, 8, 0.92) 100%),
        linear-gradient(180deg, rgba(16, 10, 8, 0.65) 0%, rgba(28, 12, 6, 0.25) 50%, rgba(12, 9, 8, 0.85) 100%);
    }

    /* Charred paper edges and soot layer */
    #soot-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 15;
      opacity: 0;
      transition: opacity 0.8s ease;
      background:
        radial-gradient(ellipse at center, transparent 36%, rgba(20, 15, 13, 0.45) 72%, rgba(10, 8, 8, 0.88) 100%);
    }

    /* Main scene wrapper */
    #scene-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      transition: filter 0.5s ease;
    }

    /* SVG stage sized fluidly for mobile, tablet, and desktop */
    #error-svg {
      width: min(92vw, 540px);
      height: min(74vh, 660px);
      max-width: 540px;
      max-height: 660px;
      overflow: visible;
      touch-action: none;
    }

    .hand-font {
      font-family: 'Fredoka', 'Inter', sans-serif;
    }

    /* Plug cursor & hover polish */
    #plug-group {
      cursor: grab;
      touch-action: none;
    }

    #plug-group:active {
      cursor: grabbing;
    }

    /* Subtle helper hint pill */
    .hint-pill {
      backdrop-filter: blur(8px);
      transition: all 0.3s ease;
    }

    /* Reset button styling */
    #reset-btn {
      transition: transform 0.2s ease, background-color 0.25s ease, box-shadow 0.25s ease, opacity 0.35s ease;
    }

    #reset-btn:hover {
      transform: translateY(-2px);
    }

    #reset-btn:active {
      transform: translateY(0) scale(0.97);
    }
  </style>
</head>
<body>
  <!-- Soot and charred edge layer -->
  <div id="soot-layer" aria-hidden="true"></div>

  <!-- Heat & scorch vignette overlay -->
  <div id="burn-overlay" aria-hidden="true"></div>

  <!-- Interactive 404 Scene -->
  <main id="scene-wrapper" class="px-4 select-none">
    <svg id="error-svg" viewBox="0 0 400 500" role="img" aria-label="404 error page with an interactive power plug and socket">
      <defs>
        <!-- Gradient for charred/scorched digits and cord -->
        <linearGradient id="charGradient" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#141110" />
          <stop offset="55%" stop-color="#3a1709" />
          <stop offset="100%" stop-color="#0b0909" />
        </linearGradient>

        <!-- Glowing ember gradient for when the page is burning -->
        <linearGradient id="emberGradient" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#ffae00" />
          <stop offset="50%" stop-color="#ff3b00" />
          <stop offset="100%" stop-color="#2b0c06" />
        </linearGradient>

        <!-- Radial glow behind socket during short-circuit -->
        <radialGradient id="socketArcGlow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
          <stop offset="35%" stop-color="#7dd3fc" stop-opacity="0.9" />
          <stop offset="70%" stop-color="#f97316" stop-opacity="0.55" />
          <stop offset="100%" stop-color="#ef4444" stop-opacity="0" />
        </radialGradient>

        <!-- Scorch mark radial gradient around socket -->
        <radialGradient id="scorchRadial" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#090707" stop-opacity="0.95" />
          <stop offset="45%" stop-color="#240e07" stop-opacity="0.82" />
          <stop offset="78%" stop-color="#451908" stop-opacity="0.38" />
          <stop offset="100%" stop-color="#000000" stop-opacity="0" />
        </radialGradient>
      </defs>

      <!-- Background scorch bloom around the socket & center -->
      <circle id="center-scorch" cx="200" cy="222" r="145" fill="url(#scorchRadial)" opacity="0" />

      <!-- Socket electric flash halo -->
      <circle id="socket-flash" cx="200" cy="222" r="78" fill="url(#socketArcGlow)" opacity="0" />

      <!-- Top cord path (dynamically updated as plug is dragged) -->
      <path
        id="top-cord"
        d="M 42 -6 C 34 45, 118 82, 148 42 C 172 10, 110 -8, 104 28 C 98 68, 224 96, 266 56 C 302 22, 238 -4, 212 34 C 196 58, 200 78, 200 92"
        fill="none"
        stroke="#111317"
        stroke-width="2.6"
        stroke-linecap="round"
        stroke-linejoin="round"
      />

      <!-- Bottom looped cord extending from socket down -->
      <path
        id="bottom-cord"
        d="M 200 264 C 200 315, 214 356, 165 376 C 110 398, 86 355, 128 336 C 176 314, 268 356, 258 404 C 248 446, 174 452, 166 414 C 158 378, 236 372, 272 412 C 302 446, 286 482, 258 506"
        fill="none"
        stroke="#111317"
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      />

      <!-- Scorched overlay paths for cords -->
      <path
        id="top-cord-char"
        d="M 42 -6 C 34 45, 118 82, 148 42 C 172 10, 110 -8, 104 28 C 98 68, 224 96, 266 56 C 302 22, 238 -4, 212 34 C 196 58, 200 78, 200 92"
        fill="none"
        stroke="url(#emberGradient)"
        stroke-width="3.8"
        stroke-linecap="round"
        opacity="0"
      />
      <path
        id="bottom-cord-char"
        d="M 200 264 C 200 315, 214 356, 165 376 C 110 398, 86 355, 128 336 C 176 314, 268 356, 258 404 C 248 446, 174 452, 166 414 C 158 378, 236 372, 272 412 C 302 446, 286 482, 258 506"
        fill="none"
        stroke="url(#emberGradient)"
        stroke-width="3.8"
        stroke-linecap="round"
        opacity="0"
      />

      <!-- Left "4" -->
      <g id="digit-4-left">
        <text
          id="text-4-left"
          x="108"
          y="258"
          text-anchor="middle"
          class="hand-font"
          font-size="112"
          font-weight="700"
          fill="#0f1115"
        >4</text>
        <text
          id="char-4-left"
          x="108"
          y="258"
          text-anchor="middle"
          class="hand-font"
          font-size="112"
          font-weight="700"
          fill="url(#emberGradient)"
          opacity="0"
        >4</text>
      </g>

      <!-- Middle "0" as an Electrical Socket -->
      <g id="socket-group">
        <!-- Outer socket ring -->
        <circle
          id="socket-outer"
          cx="200"
          cy="222"
          r="41"
          fill="#ffffff"
          stroke="#0f1115"
          stroke-width="7.5"
        />
        <!-- Inner recessed socket ring -->
        <circle
          id="socket-inner"
          cx="200"
          cy="222"
          r="33.5"
          fill="#ffffff"
          stroke="#0f1115"
          stroke-width="3.2"
        />
        <!-- Left & right receptacle holes -->
        <circle id="socket-hole-left" cx="187.5" cy="222" r="4.8" fill="#0f1115" />
        <circle id="socket-hole-right" cx="212.5" cy="222" r="4.8" fill="#0f1115" />

        <!-- Burned socket ring overlay -->
        <circle
          id="socket-burn-ring"
          cx="200"
          cy="222"
          r="41"
          fill="none"
          stroke="url(#emberGradient)"
          stroke-width="8"
          opacity="0"
        />
      </g>

      <!-- Right "4" -->
      <g id="digit-4-right">
        <text
          id="text-4-right"
          x="292"
          y="258"
          text-anchor="middle"
          class="hand-font"
          font-size="112"
          font-weight="700"
          fill="#0f1115"
        >4</text>
        <text
          id="char-4-right"
          x="292"
          y="258"
          text-anchor="middle"
          class="hand-font"
          font-size="112"
          font-weight="700"
          fill="url(#emberGradient)"
          opacity="0"
        >4</text>
      </g>

      <!-- "error page" caption -->
      <g id="error-caption-group">
        <text
          id="error-caption"
          x="200"
          y="302"
          text-anchor="middle"
          class="hand-font"
          font-size="27"
          font-weight="600"
          letter-spacing="0.6"
          fill="#14171d"
        >error page</text>
        <text
          id="error-caption-char"
          x="200"
          y="302"
          text-anchor="middle"
          class="hand-font"
          font-size="27"
          font-weight="600"
          letter-spacing="0.6"
          fill="url(#emberGradient)"
          opacity="0"
        >error page</text>
      </g>

      <!-- Draggable Power Plug (positioned around y=126 initially, just above the socket) -->
      <g id="plug-group" transform="translate(200, 126)" aria-label="Draggable power plug">
        <!-- Invisible generous hit area for easy touch & mouse grabbing -->
        <circle cx="0" cy="-6" r="42" fill="transparent" />

        <!-- Strain relief collar connecting plug body to top cord -->
        <rect
          x="-4.5"
          y="-34"
          width="9"
          height="9"
          rx="2"
          fill="#0f1115"
        />

        <!-- Plug body -->
        <path
          d="M -11 -25
             C -11 -27, 11 -27, 11 -25
             L 15 -11
             L 21 -11
             C 22.5 -11, 23.5 -10, 23.5 -8.5
             L 23.5 -2.5
             C 23.5 -1, 22.5 0, 21 0
             L 16 0
             L 16 6
             L -16 6
             L -16 0
             L -21 0
             C -22.5 0, -23.5 -1, -23.5 -2.5
             L -23.5 -8.5
             C -23.5 -10, -22.5 -11, -21 -11
             L -15 -11 Z"
          fill="#ffffff"
          stroke="#0f1115"
          stroke-width="2.6"
          stroke-linejoin="round"
        />

        <!-- Left & Right metal prongs -->
        <rect
          x="-11.5"
          y="6"
          width="4.6"
          height="13"
          rx="1.5"
          fill="#ffffff"
          stroke="#0f1115"
          stroke-width="2.4"
        />
        <rect
          x="6.9"
          y="6"
          width="4.6"
          height="13"
          rx="1.5"
          fill="#ffffff"
          stroke="#0f1115"
          stroke-width="2.4"
        />

        <!-- Ember glow overlay on plug when burned -->
        <path
          id="plug-burn-overlay"
          d="M -11 -25
             C -11 -27, 11 -27, 11 -25
             L 15 -11
             L 21 -11
             C 22.5 -11, 23.5 -10, 23.5 -8.5
             L 23.5 -2.5
             C 23.5 -1, 22.5 0, 21 0
             L 16 0
             L 16 6
             L -16 6
             L -16 0
             L -21 0
             C -22.5 0, -23.5 -1, -23.5 -2.5
             L -23.5 -8.5
             C -23.5 -10, -22.5 -11, -21 -11
             L -15 -11 Z"
          fill="url(#emberGradient)"
          opacity="0"
        />
      </g>
    </svg>

    <!-- Bottom interactive controls & status -->
    <div class="mt-2 flex flex-col items-center gap-2.5 z-40">
      <div
        id="status-hint"
        class="hint-pill px-3.5 py-1.5 rounded-full text-xs sm:text-sm font-medium bg-neutral-100/90 text-neutral-700 border border-neutral-200/80 shadow-sm text-center"
      >
        Drag the plug into the socket (or tap it)
      </div>

      <button
        id="reset-btn"
        type="button"
        class="hidden px-5 py-2.5 rounded-full text-sm font-semibold bg-neutral-900 text-white shadow-lg hover:bg-neutral-800 border border-orange-500/40 cursor-pointer"
      >
        Cool Down &amp; Restore Page
      </button>
    </div>
  </main>

  <!-- Canvas for sparks, electrical arcs, glowing embers, and rising smoke -->
  <canvas id="fx-canvas"></canvas>

  <script>
    (function () {
      "use strict";

      // DOM References
      const sceneWrapper = document.getElementById("scene-wrapper");
      const svg = document.getElementById("error-svg");
      const plugGroup = document.getElementById("plug-group");
      const topCord = document.getElementById("top-cord");
      const topCordChar = document.getElementById("top-cord-char");
      const bottomCord = document.getElementById("bottom-cord");
      const bottomCordChar = document.getElementById("bottom-cord-char");

      const text4Left = document.getElementById("text-4-left");
      const char4Left = document.getElementById("char-4-left");
      const text4Right = document.getElementById("text-4-right");
      const char4Right = document.getElementById("char-4-right");
      const errorCaption = document.getElementById("error-caption");
      const errorCaptionChar = document.getElementById("error-caption-char");

      const socketOuter = document.getElementById("socket-outer");
      const socketInner = document.getElementById("socket-inner");
      const socketHoleLeft = document.getElementById("socket-hole-left");
      const socketHoleRight = document.getElementById("socket-hole-right");
      const socketBurnRing = document.getElementById("socket-burn-ring");
      const socketFlash = document.getElementById("socket-flash");
      const centerScorch = document.getElementById("center-scorch");
      const plugBurnOverlay = document.getElementById("plug-burn-overlay");

      const burnOverlay = document.getElementById("burn-overlay");
      const sootLayer = document.getElementById("soot-layer");
      const statusHint = document.getElementById("status-hint");
      const resetBtn = document.getElementById("reset-btn");

      const canvas = document.getElementById("fx-canvas");
      const ctx = canvas.getContext("2d");

      // SVG coordinate constants
      const DEFAULT_PLUG_POS = { x: 200, y: 126 };
      const SOCKET_POS = { x: 200, y: 222 };
      const TRIGGER_DISTANCE = 54;

      // State variables
      let plugPos = { ...DEFAULT_PLUG_POS };
      let isDragging = false;
      let dragMoved = false;
      let dragOffsetSvg = { x: 0, y: 0 };
      let shortCircuitTriggered = false;
      let burnProgress = 0; // 0 -> 1 over time once triggered
      let burnStartTime = null;
      let lastFrameTime = performance.now();

      // Particle pools
      const sparks = [];
      const embers = [];
      const smokePlumes = [];
      const lightningArcs = [];

      // Web Audio API synthesizer for subtle electric crackle & arc hum (no external audio files)
      let audioCtx = null;
      function playArcSound(intensity = 1) {
        try {
          if (!audioCtx) {
            const AudioContextClass = window.AudioContext || window.webkitAudioContext;
            if (!AudioContextClass) return;
            audioCtx = new AudioContextClass();
          }
          if (audioCtx.state === "suspended") {
            audioCtx.resume();
          }

          const now = audioCtx.currentTime;
          const duration = 0.08 + Math.random() * 0.08;
          const bufferSize = Math.floor(audioCtx.sampleRate * duration);
          const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
          const data = buffer.getChannelData(0);

          for (let i = 0; i < bufferSize; i++) {
            const decay = 1 - i / bufferSize;
            data[i] = (Math.random() * 2 - 1) * decay * intensity;
          }

          const noise = audioCtx.createBufferSource();
          noise.buffer = buffer;

          const bandpass = audioCtx.createBiquadFilter();
          bandpass.type = "bandpass";
          bandpass.frequency.setValueAtTime(1600 + Math.random() * 2800, now);
          bandpass.Q.setValueAtTime(2.4, now);

          const gain = audioCtx.createGain();
          gain.gain.setValueAtTime(0.14 * Math.min(intensity, 1.5), now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

          noise.connect(bandpass);
          bandpass.connect(gain);
          gain.connect(audioCtx.destination);

          noise.start(now);
          noise.stop(now + duration);
        } catch (err) {
          // Ignore audio restrictions if blocked by browser policy
        }
      }

      // Resize canvas cleanly to match device pixel ratio
      function resizeCanvas() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.floor(window.innerWidth * dpr);
        canvas.height = Math.floor(window.innerHeight * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      // Convert client (mouse/touch) coordinates into SVG viewBox coordinates
      function clientToSvgPoint(clientX, clientY) {
        const rect = svg.getBoundingClientRect();
        const viewBox = svg.viewBox.baseVal;
        const scaleX = viewBox.width / rect.width;
        const scaleY = viewBox.height / rect.height;
        return {
          x: (clientX - rect.left) * scaleX,
          y: (clientY - rect.top) * scaleY
        };
      }

      // Convert SVG coordinates into screen pixel coordinates for canvas particles
      function svgToScreenPoint(svgX, svgY) {
        const rect = svg.getBoundingClientRect();
        const viewBox = svg.viewBox.baseVal;
        return {
          x: rect.left + (svgX / viewBox.width) * rect.width,
          y: rect.top + (svgY / viewBox.height) * rect.height
        };
      }

      // Clamp plug position within sensible SVG bounds
      function clampPlugPosition(pt) {
        return {
          x: Math.max(36, Math.min(364, pt.x)),
          y: Math.max(26, Math.min(440, pt.y))
        };
      }

      // Update plug transform and cord curve connecting from top-left loop to plug collar
      function updatePlugAndCord() {
        plugGroup.setAttribute("transform", `translate(${plugPos.x.toFixed(1)}, ${plugPos.y.toFixed(1)})`);

        // Collar tip of the plug in SVG space
        const collarX = plugPos.x;
        const collarY = plugPos.y - 34;

        // Smooth organic cable path from top edge loop down to plug collar
        const ctrl1X = 110 + (collarX - 200) * 0.25;
        const ctrl1Y = Math.max(12, collarY - 58);
        const ctrl2X = 250 + (collarX - 200) * 0.45;
        const ctrl2Y = Math.max(20, collarY - 32);

        const pathD =
          `M 42 -6 C 34 45, 118 82, 148 42 C 172 10, 110 -8, 104 28 ` +
          `C 98 68, 224 96, 266 56 C 302 22, 238 -4, ${ctrl1X.toFixed(1)} ${ctrl1Y.toFixed(1)} ` +
          `C ${ctrl2X.toFixed(1)} ${ctrl2Y.toFixed(1)}, ${(collarX + 12).toFixed(1)} ${(collarY - 14).toFixed(1)}, ${collarX.toFixed(1)} ${collarY.toFixed(1)}`;

        topCord.setAttribute("d", pathD);
        topCordChar.setAttribute("d", pathD);
      }

      // Spawn a burst of sparks at screen coordinates
      function spawnSparks(screenX, screenY, count = 24, speedMultiplier = 1) {
        for (let i = 0; i < count; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = (110 + Math.random() * 420) * speedMultiplier;
          const palette = ["#ffffff", "#fef08a", "#fb923c", "#f97316", "#38bdf8"];
          sparks.push({
            x: screenX,
            y: screenY,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - 60,
            gravity: 780 + Math.random() * 340,
            life: 0,
            maxLife: 0.25 + Math.random() * 0.48,
            size: 1.6 + Math.random() * 2.8,
            color: palette[Math.floor(Math.random() * palette.length)],
            trail: []
          });
        }
      }

      // Spawn jagged electric arcs between plug and socket
      function spawnLightningArc(fromSvg, toSvg, branches = 2) {
        const start = svgToScreenPoint(fromSvg.x, fromSvg.y);
        const end = svgToScreenPoint(toSvg.x, toSvg.y);

        for (let b = 0; b < branches; b++) {
          const points = [start];
          const segments = 7 + Math.floor(Math.random() * 5);
          for (let i = 1; i < segments; i++) {
            const t = i / segments;
            const bx = start.x + (end.x - start.x) * t;
            const by = start.y + (end.y - start.y) * t;
            const jitter = (1 - Math.abs(t - 0.5) * 1.4) * 34;
            points.push({
              x: bx + (Math.random() - 0.5) * jitter * 2,
              y: by + (Math.random() - 0.5) * jitter * 2
            });
          }
          points.push(end);

          lightningArcs.push({
            points,
            life: 0,
            maxLife: 0.09 + Math.random() * 0.08,
            width: 1.5 + Math.random() * 2.4
          });
        }
      }

      // Spawn glowing embers drifting upward
      function spawnEmbers(count = 6) {
        const rect = svg.getBoundingClientRect();
        for (let i = 0; i < count; i++) {
          embers.push({
            x: rect.left + rect.width * (0.25 + Math.random() * 0.5),
            y: rect.top + rect.height * (0.35 + Math.random() * 0.35),
            vx: (Math.random() - 0.5) * 55,
            vy: -(45 + Math.random() * 95),
            wobblePhase: Math.random() * Math.PI * 2,
            life: 0,
            maxLife: 1.1 + Math.random() * 1.3,
            radius: 1.8 + Math.random() * 2.8
          });
        }
      }

      // Spawn rising smoke puffs
      function spawnSmoke(count = 3) {
        const rect = svg.getBoundingClientRect();
        for (let i = 0; i < count; i++) {
          smokePlumes.push({
            x: rect.left + rect.width * (0.22 + Math.random() * 0.56),
            y: rect.top + rect.height * (0.28 + Math.random() * 0.34),
            vx: (Math.random() - 0.5) * 32,
            vy: -(38 + Math.random() * 58),
            radius: 14 + Math.random() * 18,
            maxRadius: 52 + Math.random() * 38,
            life: 0,
            maxLife: 1.8 + Math.random() * 1.4,
            darkness: 0.16 + Math.random() * 0.18
          });
        }
      }

      // Trigger the short-circuit and burning sequence
      function triggerShortCircuit() {
        if (shortCircuitTriggered) return;
        shortCircuitTriggered = true;
        burnStartTime = performance.now();
        burnProgress = 0.05;

        // Snap plug snugly onto/into socket face
        plugPos = { x: SOCKET_POS.x, y: SOCKET_POS.y - 18 };
        updatePlugAndCord();

        // Start screen shake
        sceneWrapper.classList.add("shaking");

        // Initial massive spark & arc burst
        const socketScreen = svgToScreenPoint(SOCKET_POS.x, SOCKET_POS.y);
        spawnSparks(socketScreen.x, socketScreen.y, 65, 1.45);
        spawnLightningArc(plugPos, SOCKET_POS, 4);
        spawnSmoke(6);
        spawnEmbers(12);
        playArcSound(1.5);

        // Update UI status & reveal reset button shortly after ignition
        statusHint.textContent = "SHORT CIRCUIT! Everything is sparking and burning!";
        statusHint.className =
          "hint-pill px-4 py-1.5 rounded-full text-xs sm:text-sm font-semibold bg-red-950/90 text-orange-200 border border-orange-500/60 shadow-md text-center";

        setTimeout(() => {
          resetBtn.classList.remove("hidden");
        }, 750);
      }

      // Cool down and restore the page back to its clean initial state
      function resetPage() {
        shortCircuitTriggered = false;
        burnProgress = 0;
        burnStartTime = null;
        isDragging = false;
        dragMoved = false;

        plugPos = { ...DEFAULT_PLUG_POS };
        updatePlugAndCord();

        sceneWrapper.classList.remove("shaking");
        sceneWrapper.style.filter = "none";

        // Reset all burn/scorch visual layers
        burnOverlay.style.opacity = "0";
        sootLayer.style.opacity = "0";
        centerScorch.setAttribute("opacity", "0");
        socketFlash.setAttribute("opacity", "0");
        plugBurnOverlay.setAttribute("opacity", "0");

        topCordChar.setAttribute("opacity", "0");
        bottomCordChar.setAttribute("opacity", "0");
        char4Left.setAttribute("opacity", "0");
        char4Right.setAttribute("opacity", "0");
        errorCaptionChar.setAttribute("opacity", "0");
        socketBurnRing.setAttribute("opacity", "0");

        text4Left.setAttribute("fill", "#0f1115");
        text4Right.setAttribute("fill", "#0f1115");
        errorCaption.setAttribute("fill", "#14171d");
        topCord.setAttribute("stroke", "#111317");
        bottomCord.setAttribute("stroke", "#111317");
        socketOuter.setAttribute("stroke", "#0f1115");
        socketOuter.setAttribute("fill", "#ffffff");
        socketInner.setAttribute("stroke", "#0f1115");
        socketInner.setAttribute("fill", "#ffffff");
        socketHoleLeft.setAttribute("fill", "#0f1115");
        socketHoleRight.setAttribute("fill", "#0f1115");

        // Clear active particles
        sparks.length = 0;
        embers.length = 0;
        smokePlumes.length = 0;
        lightningArcs.length = 0;

        statusHint.textContent = "Drag the plug into the socket (or tap it)";
        statusHint.className =
          "hint-pill px-3.5 py-1.5 rounded-full text-xs sm:text-sm font-medium bg-neutral-100/90 text-neutral-700 border border-neutral-200/80 shadow-sm text-center";
        resetBtn.classList.add("hidden");
      }

      // Check proximity between plug and socket while dragging
      function checkProximityAndShortCircuit() {
        if (shortCircuitTriggered) return;
        const dx = plugPos.x - SOCKET_POS.x;
        const dy = plugPos.y - (SOCKET_POS.y - 18);
        const distance = Math.hypot(dx, dy);

        // Pre-spark warning arcs when getting close
        if (distance < 95 && Math.random() < 0.35) {
          const midScreen = svgToScreenPoint(
            (plugPos.x + SOCKET_POS.x) * 0.5,
            (plugPos.y + SOCKET_POS.y) * 0.5
          );
          spawnSparks(midScreen.x, midScreen.y, 5, 0.75);
          spawnLightningArc(plugPos, SOCKET_POS, 1);
          socketFlash.setAttribute("opacity", "0.45");
        } else if (!shortCircuitTriggered) {
          socketFlash.setAttribute("opacity", "0");
        }

        if (distance <= TRIGGER_DISTANCE) {
          triggerShortCircuit();
        }
      }

      // Pointer / Touch drag handlers on the plug
      function onPointerDown(e) {
        if (shortCircuitTriggered) return;
        e.preventDefault();
        isDragging = true;
        dragMoved = false;

        const pt = clientToSvgPoint(e.clientX, e.clientY);
        dragOffsetSvg = {
          x: plugPos.x - pt.x,
          y: plugPos.y - pt.y
        };
      }

      function onPointerMove(e) {
        if (!isDragging || shortCircuitTriggered) return;
        e.preventDefault();
        dragMoved = true;

        const pt = clientToSvgPoint(e.clientX, e.clientY);
        plugPos = clampPlugPosition({
          x: pt.x + dragOffsetSvg.x,
          y: pt.y + dragOffsetSvg.y
        });

        updatePlugAndCord();
        checkProximityAndShortCircuit();
      }

      function onPointerUp(e) {
        if (!isDragging) return;
        isDragging = false;

        // If user simply clicked/tapped the plug without dragging far, pull it into the socket
        if (!dragMoved && !shortCircuitTriggered) {
          plugPos = { ...SOCKET_POS, y: SOCKET_POS.y - 18 };
          updatePlugAndCord();
          triggerShortCircuit();
        }
      }

      // Also allow clicking the socket directly to pull the plug in
      function onSocketClick() {
        if (shortCircuitTriggered) return;
        plugPos = { x: SOCKET_POS.x, y: SOCKET_POS.y - 18 };
        updatePlugAndCord();
        triggerShortCircuit();
      }

      // Update scorch & burning visuals smoothly over time
      function updateBurnVisuals(now, dt) {
        if (!shortCircuitTriggered) return;

        const elapsed = (now - burnStartTime) / 1000;
        burnProgress = Math.min(1, elapsed / 2.2);

        // Stop violent shaking after ~1.1s, keep subtle heat glow
        if (elapsed > 1.15) {
          sceneWrapper.classList.remove("shaking");
        }

        // Flash and scorch spread
        const flashIntensity = Math.max(0, Math.sin(elapsed * 28) * 0.5 + 0.5) * (1 - burnProgress * 0.5);
        socketFlash.setAttribute("opacity", (flashIntensity * 0.85).toFixed(2));

        centerScorch.setAttribute("opacity", Math.min(0.95, 0.25 + burnProgress * 0.7).toFixed(2));
        burnOverlay.style.opacity = Math.min(0.92, 0.2 + burnProgress * 0.72).toFixed(2);
        sootLayer.style.opacity = Math.min(0.95, 0.15 + burnProgress * 0.8).toFixed(2);

        // Charred digits, socket, caption, and cord overlays
        const charOpacity = Math.min(1, burnProgress * 1.35).toFixed(2);
        char4Left.setAttribute("opacity", charOpacity);
        char4Right.setAttribute("opacity", charOpacity);
        errorCaptionChar.setAttribute("opacity", charOpacity);
        socketBurnRing.setAttribute("opacity", charOpacity);
        topCordChar.setAttribute("opacity", charOpacity);
        bottomCordChar.setAttribute("opacity", charOpacity);
        plugBurnOverlay.setAttribute("opacity", Math.min(0.85, burnProgress * 1.1).toFixed(2));

        // Darken underlying fills into soot/char
        if (burnProgress > 0.25) {
          text4Left.setAttribute("fill", "#1a0c08");
          text4Right.setAttribute("fill", "#1a0c08");
          errorCaption.setAttribute("fill", "#1f0e09");
          topCord.setAttribute("stroke", "#180b07");
          bottomCord.setAttribute("stroke", "#180b07");
          socketOuter.setAttribute("fill", "#1c1210");
          socketInner.setAttribute("fill", "#140c0b");
          socketHoleLeft.setAttribute("fill", "#ff6a00");
          socketHoleRight.setAttribute("fill", "#ff6a00");
        }

        // Continuous sparks & lightning during early/mid short circuit, plus ongoing smoke & embers
        if (elapsed < 1.35 && Math.random() < 0.75) {
          const socketScreen = svgToScreenPoint(
            SOCKET_POS.x + (Math.random() - 0.5) * 36,
            SOCKET_POS.y + (Math.random() - 0.5) * 36
          );
          spawnSparks(socketScreen.x, socketScreen.y, 10, 1.15);
          if (Math.random() < 0.55) {
            spawnLightningArc(
              { x: SOCKET_POS.x + (Math.random() - 0.5) * 50, y: SOCKET_POS.y - 25 },
              { x: SOCKET_POS.x + (Math.random() - 0.5) * 50, y: SOCKET_POS.y + 25 },
              1
            );
          }
          if (Math.random() < 0.25) {
            playArcSound(0.9);
          }
        }

        if (Math.random() < 0.65) {
          spawnSmoke(2);
        }
        if (Math.random() < 0.75) {
          spawnEmbers(3);
        }
      }

      // Render & step all canvas particles (smoke, lightning arcs, sparks, embers)
      function updateAndDrawParticles(dt) {
        ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);

        // 1. Smoke plumes
        for (let i = smokePlumes.length - 1; i >= 0; i--) {
          const s = smokePlumes[i];
          s.life += dt;
          if (s.life >= s.maxLife) {
            smokePlumes.splice(i, 1);
            continue;
          }
          const t = s.life / s.maxLife;
          s.x += s.vx * dt + Math.sin(s.life * 3 + i) * 14 * dt;
          s.y += s.vy * dt;
          const r = s.radius + (s.maxRadius - s.radius) * t;
          const alpha = s.darkness * Math.sin(t * Math.PI);

          ctx.save();
          ctx.beginPath();
          ctx.arc(s.x, s.y, r, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(38, 34, 33, ${alpha.toFixed(3)})`;
          ctx.fill();
          ctx.restore();
        }

        // 2. Electric lightning arcs
        for (let i = lightningArcs.length - 1; i >= 0; i--) {
          const arc = lightningArcs[i];
          arc.life += dt;
          if (arc.life >= arc.maxLife) {
            lightningArcs.splice(i, 1);
            continue;
          }
          const alpha = 1 - arc.life / arc.maxLife;

          ctx.save();
          ctx.beginPath();
          arc.points.forEach((pt, idx) => {
            if (idx === 0) ctx.moveTo(pt.x, pt.y);
            else ctx.lineTo(pt.x, pt.y);
          });
          ctx.strokeStyle = `rgba(125, 211, 252, ${alpha.toFixed(2)})`;
          ctx.lineWidth = arc.width * 2.2;
          ctx.lineCap = "round";
          ctx.lineJoin = "round";
          ctx.shadowColor = "#38bdf8";
          ctx.shadowBlur = 14;
          ctx.stroke();

          ctx.strokeStyle = `rgba(255, 255, 255, ${alpha.toFixed(2)})`;
          ctx.lineWidth = arc.width;
          ctx.stroke();
          ctx.restore();
        }

        // 3. Bright flying sparks
        for (let i = sparks.length - 1; i >= 0; i--) {
          const p = sparks[i];
          p.life += dt;
          if (p.life >= p.maxLife) {
            sparks.splice(i, 1);
            continue;
          }

          p.trail.push({ x: p.x, y: p.y });
          if (p.trail.length > 5) p.trail.shift();

          p.vy += p.gravity * dt;
          p.x += p.vx * dt;
          p.y += p.vy * dt;

          const alpha = 1 - p.life / p.maxLife;

          ctx.save();
          if (p.trail.length > 1) {
            ctx.beginPath();
            ctx.moveTo(p.trail[0].x, p.trail[0].y);
            for (let k = 1; k < p.trail.length; k++) {
              ctx.lineTo(p.trail[k].x, p.trail[k].y);
            }
            ctx.strokeStyle = p.color;
            ctx.globalAlpha = alpha * 0.7;
            ctx.lineWidth = p.size * 0.85;
            ctx.lineCap = "round";
            ctx.stroke();
          }

          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fillStyle = p.color;
          ctx.globalAlpha = alpha;
          ctx.shadowColor = "#fb923c";
          ctx.shadowBlur = 10;
          ctx.fill();
          ctx.restore();
        }

        // 4. Glowing embers
        for (let i = embers.length - 1; i >= 0; i--) {
          const e = embers[i];
          e.life += dt;
          if (e.life >= e.maxLife) {
            embers.splice(i, 1);
            continue;
          }

          const t = e.life / e.maxLife;
          e.x += (e.vx + Math.cos(e.life * 5 + e.wobblePhase) * 28) * dt;
          e.y += e.vy * dt;
          const alpha = Math.sin(t * Math.PI);

          ctx.save();
          ctx.beginPath();
          ctx.arc(e.x, e.y, e.radius * (1 - t * 0.4), 0, Math.PI * 2);
          ctx.fillStyle = t < 0.45 ? "#ffaa00" : "#ff3b00";
          ctx.globalAlpha = alpha * 0.92;
          ctx.shadowColor = "#ff4500";
          ctx.shadowBlur = 12;
          ctx.fill();
          ctx.restore();
        }
      }

      // Main animation loop
      function animate(now) {
        const dt = Math.min(0.05, (now - lastFrameTime) / 1000);
        lastFrameTime = now;

        updateBurnVisuals(now, dt);
        updateAndDrawParticles(dt);

        requestAnimationFrame(animate);
      }

      // Event listeners
      window.addEventListener("resize", resizeCanvas);

      plugGroup.addEventListener("pointerdown", onPointerDown);
      window.addEventListener("pointermove", onPointerMove, { passive: false });
      window.addEventListener("pointerup", onPointerUp);
      window.addEventListener("pointercancel", onPointerUp);

      document.getElementById("socket-group").addEventListener("click", onSocketClick);
      resetBtn.addEventListener("click", resetPage);

      // Initialize
      resizeCanvas();
      updatePlugAndCord();
      requestAnimationFrame(animate);
    })();
  </script>
</body>
</html>
